# ============================================================
# application.yml — P2P Payment Ledger backend configuration
#
# Spring Boot reads configuration from OS environment variables.
# For local development, use backend/run.ps1 which loads
# backend/.env and sets the variables before starting the app.
# Never commit real credentials to this file or to .env.
# See .env.example at the project root for the full template.
# ============================================================
spring:
  application:
    name: p2p-payment-ledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p2p_payment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  admin:
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@example.com}
      # Password read from env var — never hardcode a real password here
      # Set ADMIN_BOOTSTRAP_PASSWORD in your environment before first startup
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

  login-attempt:
    max-failures: ${LOGIN_ATTEMPT_MAX_FAILURES:5}
    lockout-minutes: ${LOGIN_ATTEMPT_LOCKOUT_MINUTES:30}

server:
  port: 8080

logging:
  level:
    com.p2ppayment: INFO
    org.flywaydb: INFO